demo-athena:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: athena
      s3_staging_dir: "{{ env_var('DBT_ATHENA_S3_STAGING_DIR') }}"
      s3_tmp_table_dir: "{{ env_var('DBT_ATHENA_S3_TMP_TABLE_DIR') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      work_group: primary
      schema: demo

    ci:
      type: athena
      s3_staging_dir: "{{ env_var('DBT_ATHENA_S3_STAGING_DIR') }}"
      s3_tmp_table_dir: "{{ env_var('DBT_ATHENA_S3_TMP_TABLE_DIR') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      work_group: primary
      schema: "{{ env_var('DBT_ATHENA_CI_SCHEMA', 'demo_ci') }}"

    prod:
      type: athena
      s3_staging_dir: "{{ env_var('DBT_ATHENA_S3_STAGING_DIR') }}"
      s3_tmp_table_dir: "{{ env_var('DBT_ATHENA_S3_TMP_TABLE_DIR') }}"
      region_name: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      database: awsdatacatalog
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"
      work_group: primary
      schema: demo

version: 2

models:
  - name: fct_daily_orders
    description: Daily order metrics derived from the staged demo orders.
    columns:
      - name: order_date
        description: Daily aggregation grain.
        tests:
          - not_null
          - unique
      - name: order_count
        description: Number of non-cancelled orders for the day.
        tests:
          - not_null
      - name: gross_revenue_usd
        description: Total USD revenue for the day.
        tests:
          - not_null
      - name: average_order_value_usd
        description: Average order value in USD for the day.
        tests:
          - not_null

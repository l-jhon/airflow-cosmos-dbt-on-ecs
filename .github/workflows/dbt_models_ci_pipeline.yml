name: DBT Models - CI Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - dbt-models/**
      - dags/dbt_models_dags/**
      - dags/tests/**
      - dags/utils/ecs_utils.py
      - airflow-local-runner/**
      - .github/workflows/dbt_models_ci_pipeline.yml
  workflow_dispatch:

concurrency:
  group: dbt-models-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  factory_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install factory test dependency
        run: python -m pip install PyYAML

      - name: Run DAG factory tests
        run: python -m unittest dags.tests.test_dbt_dag_factory

  dbt_integration:
    needs: factory_tests
    if: |
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) &&
      vars.AWS_GITHUB_ACTIONS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DBT_TARGET: ci
      DBT_ATHENA_S3_STAGING_DIR: ${{ vars.DBT_ATHENA_S3_STAGING_DIR }}
      DBT_ATHENA_S3_TMP_TABLE_DIR: ${{ vars.DBT_ATHENA_S3_TMP_TABLE_DIR }}
      DBT_ATHENA_CI_SCHEMA_PREFIX: ${{ vars.DBT_ATHENA_CI_SCHEMA_PREFIX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          installer-parallel: true

      - name: Define isolated CI schemas
        run: |
          SCHEMA_PREFIX="${DBT_ATHENA_CI_SCHEMA_PREFIX:-demo_ci}"
          RUN_KEY="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "DBT_ATHENA_CI_SCHEMA=${SCHEMA_PREFIX}_${RUN_KEY}" >> "$GITHUB_ENV"
          echo "DBT_ATHENA_RAW_SCHEMA=${SCHEMA_PREFIX}_${RUN_KEY}_raw" >> "$GITHUB_ENV"
          echo "DBT_ATHENA_STAGE_SCHEMA=${SCHEMA_PREFIX}_${RUN_KEY}_stage" >> "$GITHUB_ENV"
          echo "DBT_ATHENA_ANALYTICS_SCHEMA=${SCHEMA_PREFIX}_${RUN_KEY}_analytics" >> "$GITHUB_ENV"

      - name: Install dbt dependencies
        run: |
          cd dbt-models
          poetry install --no-interaction --no-root

      - name: Run dbt deps
        run: |
          cd dbt-models
          poetry run dbt deps --target "$DBT_TARGET"

      - name: Run dbt debug
        run: |
          cd dbt-models
          poetry run dbt debug --target "$DBT_TARGET"

      - name: Run dbt build
        run: |
          cd dbt-models
          poetry run dbt build --select +path:models/demo --target "$DBT_TARGET"

      - name: Run dbt tests
        run: |
          cd dbt-models
          poetry run dbt test --select path:models/demo --target "$DBT_TARGET"

      - name: Clean up CI schemas
        if: always()
        run: |
          cd dbt-models
          poetry run dbt run-operation cleanup_demo_schemas --args "{\"schemas\": [\"$DBT_ATHENA_RAW_SCHEMA\", \"$DBT_ATHENA_STAGE_SCHEMA\", \"$DBT_ATHENA_ANALYTICS_SCHEMA\", \"$DBT_ATHENA_CI_SCHEMA\"]}" --target "$DBT_TARGET" || true

name: DBT Models - CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - dbt-models/**
      - dags/dbt_models_dags/**
      - dags/utils/ecs_utils.py
      - airflow-local-runner/**
      - infra/terraform/**
      - .github/workflows/dbt_models_cd_pipeline.yml
  workflow_dispatch:

concurrency:
  group: dbt-models-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish_demo:
    if: vars.AWS_GITHUB_ACTIONS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DBT_TARGET: prod
      DBT_ATHENA_S3_STAGING_DIR: ${{ vars.DBT_ATHENA_S3_STAGING_DIR }}
      DBT_ATHENA_S3_TMP_TABLE_DIR: ${{ vars.DBT_ATHENA_S3_TMP_TABLE_DIR }}
      DBT_MANIFEST_URI: ${{ vars.DBT_MANIFEST_URI }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      MWAA_DAGS_S3_URI: ${{ vars.MWAA_DAGS_S3_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set deploy defaults
        run: |
          PROJECT_NAME_VALUE="${PROJECT_NAME:-airflow-cosmos-dbt-on-ecs}"
          ECR_REPOSITORY_VALUE="${ECR_REPOSITORY:-${PROJECT_NAME_VALUE}-prod}"
          echo "PROJECT_NAME=${PROJECT_NAME_VALUE}" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=${ECR_REPOSITORY_VALUE}" >> "$GITHUB_ENV"
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and configure Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.1.3
          installer-parallel: true

      - name: Install dbt dependencies
        run: |
          cd dbt-models
          poetry install --no-interaction --no-root

      - name: Run dbt deps
        run: |
          cd dbt-models
          poetry run dbt deps --target "$DBT_TARGET"

      - name: Run dbt debug
        run: |
          cd dbt-models
          poetry run dbt debug --target "$DBT_TARGET"

      - name: Compile demo manifest
        run: |
          cd dbt-models
          poetry run dbt compile --select +path:models/demo --target "$DBT_TARGET"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --image-tag-mutability MUTABLE --image-scanning-configuration scanOnPush=true

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push dbt image
        run: |
          cd dbt-models
          ENV=prod PROJECT_NAME="$PROJECT_NAME" ECR_REPOSITORY="$ECR_REPOSITORY" AWS_REGION="$AWS_REGION" AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID" make build_and_push_docker_image

      - name: Upload manifest.json
        if: env.DBT_MANIFEST_URI != ''
        run: aws s3 cp dbt-models/target/manifest.json "$DBT_MANIFEST_URI"

      - name: Sync DAG assets for optional MWAA path
        if: env.MWAA_DAGS_S3_URI != ''
        run: |
          aws s3 sync ./dags "${MWAA_DAGS_S3_URI%/}/dags" --delete --exclude "__pycache__/*"
          aws s3 sync ./dbt-models "${MWAA_DAGS_S3_URI%/}/dags/dbt-models" --delete --exclude ".venv/*" --exclude "__pycache__/*" --exclude "logs/*" --exclude "target/*"
